[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
addopts = -ra --strict-markers
testpaths = tests
markers =
    integration: full request/response flows across multiple apps (e.g. group -> buyout -> webhook -> trip)
    load: lightweight load/performance smoke tests (small by default; scale with --run-load)
    concurrency: thread/race tests against a row-locking database (PostgreSQL)
    slow: long-running tests excluded from the default CI run